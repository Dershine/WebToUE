<!doctype html>
<html>
<head>
  <link rel="stylesheet" href="ScrollableSettings.css">
</head>
<body>
  <div class="settings-shell">
    <p class="title">Settings</p>
    <p class="subtitle">Move the mouse over the list and use the wheel to scroll.</p>
    <div class="settings-list">
      <button id="display" class="setting-row" data-ue-on-click="OpenDisplaySettings">Display</button>
      <button id="graphics" class="setting-row" data-ue-on-click="OpenGraphicsSettings">Graphics</button>
      <button id="audio" class="setting-row" data-ue-on-click="OpenAudioSettings">Audio</button>
      <button id="controls" class="setting-row" data-ue-on-click="OpenControlSettings">Controls</button>
      <button id="gameplay" class="setting-row" data-ue-on-click="OpenGameplaySettings">Gameplay</button>
      <button id="accessibility" class="setting-row" data-ue-on-click="OpenAccessibilitySettings">Accessibility</button>
      <button id="language" class="setting-row" data-ue-on-click="OpenLanguageSettings">Language</button>
    </div>
  </div>
</body>
</html>
